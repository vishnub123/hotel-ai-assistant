spring.application.name=hotel-ai-assistant
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-256-bit-secret-key-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:hotel-ai-assistant-bucket}

# LangChain4j / OpenAI. Leave blank to start the backend without AI; /api/chat returns a clear configuration error.
langchain4j.open-ai.chat-model.api-key=${OPENROUTER_API_KEY:}
langchain4j.open-ai.chat-model.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
langchain4j.open-ai.chat-model.model-name=${OPENROUTER_MODEL:openrouter/free}
langchain4j.open-ai.chat-model.temperature=0.2
langchain4j.open-ai.chat-model.timeout=60s
langchain4j.open-ai.chat-model.temperature=0.2
langchain4j.open-ai.chat-model.timeout=60s

management.endpoints.web.exposure.include=health,info
